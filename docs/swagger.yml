openapi: 3.0.0
info:
  title: Express Authentication API
  version: 1.0.0
  description: API Documentation for the advanced authentication system.
servers:
  - url: http://localhost:3000/api
paths:
  /auth/register:
    post:
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                password:
                  type: string
      responses:
        '201':
          description: User created
        '400':
          description: Bad request
  /auth/login:
    post:
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Logged in successfully
        '301':
          description: MFA Required
  /auth/mfa/enable:
    post:
      summary: Enable MFA
      security:
        - bearerAuth: []
      responses:
        '200':
          description: MFA Enabled
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
